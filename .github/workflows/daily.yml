name: daily-digest

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Restore digest state
        uses: actions/cache@v4
        with:
          path: .paper_emailer/state.sqlite3
          key: paper-emailer-state-${{ github.run_id }}
          restore-keys: |
            paper-emailer-state-

      - name: Restore embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Sync environment
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

      - name: Run digest
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: Sustainable AI Digest
          SENDGRID_TO_EMAIL: ${{ secrets.SENDGRID_TO_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPER_EMAILER_STATE_PATH: .paper_emailer/state.sqlite3
          PYTHONUNBUFFERED: "1"
        run: uv run paper-emailer