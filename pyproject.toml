[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-emailer"
version = "0.1.0"
description = "Python workspace for paper_emailer"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paper-emailer = "paper_emailer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]